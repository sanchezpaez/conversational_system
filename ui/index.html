<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support Agent – Chat UI</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
        min-height: 100vh;
      }

      .container {
        width: 100%;
        max-width: 640px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      h1 { font-size: 1.25rem; color: #111; }

      .subtitle {
        color: #666;
        font-size: 0.9rem;
      }

      .config-row {
        display: flex;
        gap: 0.75rem;
      }

      .config-row label {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.8rem;
        color: #555;
        flex: 1;
      }

      input[type="password"],
      input[type="text"] {
        padding: 0.5rem 0.75rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 0.9rem;
        width: 100%;
      }

      input:focus { outline: 2px solid #4f86f7; border-color: transparent; }

      #history {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 1rem;
        min-height: 200px;
        max-height: 400px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .msg {
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        max-width: 85%;
        font-size: 0.9rem;
        line-height: 1.4;
        word-break: break-word;
      }

      .msg.user  { background: #4f86f7; color: #fff; align-self: flex-end; }
      .msg.agent { background: #efefef; color: #111; align-self: flex-start; }
      .msg.error { background: #fdecea; color: #b00020; align-self: flex-start; font-size: 0.8rem; }
      .msg.placeholder {
        background: transparent;
        color: #888;
        align-self: center;
        text-align: center;
        font-style: italic;
      }

      .quick-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .quick-action-btn {
        background: #fff;
        color: #1f3f83;
        border: 1px solid #cfe0ff;
      }

      .quick-action-btn:hover:not(:disabled) {
        background: #eef4ff;
      }

      .input-row { display: flex; gap: 0.5rem; }
      #message   { flex: 1; }

      button {
        padding: 0.5rem 1.25rem;
        background: #4f86f7;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 0.9rem;
        cursor: pointer;
        white-space: nowrap;
      }

      button:disabled { background: #aac4fb; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div class="container">
    <h1>Support Agent – Chat UI</h1>
      <p class="subtitle">Fast internal UI for manual support-agent testing.</p>


      <div class="config-row">
        <label>
          X-API-Key
          <input id="api-key" type="password" placeholder="Enter CHAT_API_KEY" autocomplete="current-password" />
        </label>
        <label>
          Session ID (optional)
          <input id="session-id" type="text" placeholder="session-1" />
        </label>
      </div>

      <div class="quick-actions">
        <button class="quick-action-btn" type="button" data-message="Where is my order AB-123?">Check order</button>
        <button class="quick-action-btn" type="button" data-message="I want to change my booking for order 7821 to 2026-09-15">Change booking</button>
        <button class="quick-action-btn" type="button" data-message="I need help with my booking">Need help</button>
      </div>

      <div id="history"></div>

      <div class="input-row">
        <input id="message" type="text" placeholder="" />
        <button id="send-btn" type="button">Send</button>
      </div>
    </div>

    <script>
      const sendButton   = document.getElementById("send-btn");
      const messageInput = document.getElementById("message");
      const sessionInput = document.getElementById("session-id");
      const apiKeyInput  = document.getElementById("api-key");
      const historyDiv   = document.getElementById("history");
      const quickActionButtons = document.querySelectorAll(".quick-action-btn");

      let isSending = false;
      sessionInput.value = crypto.randomUUID();

      function renderEmptyHistory() {
        if (historyDiv.childElementCount === 0) {
          appendMsg("No messages yet. Use a quick action or write your own question.", "placeholder");
        }
      }

      function appendMsg(text, type) {
        const placeholder = historyDiv.querySelector(".msg.placeholder");
        if (placeholder) placeholder.remove();

        const div = document.createElement("div");
        div.className = `msg ${type}`;
        div.textContent = text;
        historyDiv.appendChild(div);
        // Auto-scroll to the latest message.
        historyDiv.scrollTop = historyDiv.scrollHeight;
      }

      function setSendingState(nextState) {
        isSending = nextState;
        sendButton.disabled = nextState;
        sendButton.textContent = nextState ? "Sending\u2026" : "Send";
        quickActionButtons.forEach((button) => {
          button.disabled = nextState;
        });
      }

      async function sendMessage() {
        if (isSending) return;

        const message   = messageInput.value.trim();
        const sessionId = sessionInput.value.trim();
        const apiKey    = apiKeyInput.value.trim();

        if (!apiKey)  { appendMsg("Please provide X-API-Key.", "error"); return; }
        if (!message) { appendMsg("Please write a message first.", "error"); return; }

        appendMsg(message, "user");
        messageInput.value = "";

        // Disable input while waiting for the API response.
        setSendingState(true);

        const payload = { message };
        if (sessionId) {
          payload.session_id = sessionId;
        }

        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-API-Key": apiKey,
            },
            body: JSON.stringify(payload),
          });

          const data = await response.json();

          if (response.status === 401) {
            appendMsg("Authentication error: check your X-API-Key.", "error");
          } else if (response.status === 503) {
            appendMsg("Service not configured – OPENAI_API_KEY is missing on the server.", "error");
          } else if (!response.ok) {
            appendMsg(`Server error (${response.status}): ${data.detail || "unknown"}`, "error");
          } else {
            appendMsg(data.reply, "agent");
          }
        } catch (err) {
          // Network-level failure (server down, no internet, etc.).
          appendMsg(`Network error: ${err.message}`, "error");
        } finally {
          // Always re-enable the button so the user can retry.
          setSendingState(false);
          messageInput.focus();
        }
      }

      sendButton.addEventListener("click", sendMessage);
      messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") sendMessage();
      });
      quickActionButtons.forEach((button) => {
        button.addEventListener("click", () => {
          messageInput.value = button.dataset.message;
          messageInput.focus();
        });
      });

      renderEmptyHistory();
    </script>
  </body>
</html>
